
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chud site</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0b0f14;
    --card: #121821;
    --card-hover: #18212d;
    --border: #253142;
    --text: #ffffff;
    --muted: #93a2b7;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 55px 24px 115px;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at top center,
            rgba(88,101,242,.15), transparent 40%),
        radial-gradient(circle at bottom right,
            rgba(124,58,237,.10), transparent 35%),
        radial-gradient(circle at bottom left,
            rgba(59,130,246,.08), transparent 30%);
    pointer-events: none;
    z-index: -1;
    animation: glow 12s ease-in-out infinite alternate;
}

@keyframes glow {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

/* Profile */

.container {
    width: 100%;
    max-width: 560px;
}

.profile {
    text-align: center;
    margin-bottom: 40px;
}

.avatar {
    width: 160px;
    height: 160px;
    display: block;
    margin: 0 auto;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--border);
    box-shadow:
        0 0 40px rgba(88,101,242,.20),
        0 0 100px rgba(124,58,237,.10);
}

h1 {
    margin-top: 24px;
    font-size: 2.2rem;
    font-weight: 800;
}

.username {
    margin-top: 10px;
    color: var(--muted);
}

/* Social Links */

.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.link {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    color: white;
    text-decoration: none;
    font-family: inherit;
    text-align: left;
    font-size: inherit;
    cursor: pointer;
    transition: .2s ease;
}

.link:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: #3d5068;
}

.icon {
    width: 28px;
    height: 28px;
    object-fit: contain;
    flex-shrink: 0;
}

.link-title {
    font-size: 1rem;
    font-weight: 600;
}

/* Steam Popup */

.steam-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 3000;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease, visibility .2s ease;
}

.steam-overlay.show {
    opacity: 1;
    visibility: visible;
}

.steam-modal {
    width: 100%;
    max-width: 390px;
    background: #121821;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 70px rgba(0,0,0,.65);
    transform: translateY(12px) scale(.97);
    transition: transform .2s ease;
}

.steam-overlay.show .steam-modal {
    transform: translateY(0) scale(1);
}

.steam-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.steam-modal-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.steam-modal-title img {
    width: 28px;
    height: 28px;
}

.steam-modal-title h2 {
    font-size: 18px;
    font-weight: 700;
}

.steam-close {
    width: 32px;
    height: 32px;
    background: #1b2430;
    border: 1px solid #334155;
    border-radius: 9px;
    color: #93a2b7;
    font-size: 22px;
    cursor: pointer;
    transition: .2s;
}

.steam-close:hover {
    background: #263548;
    color: white;
}

.steam-accounts {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.steam-account {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 17px;
    background: #0b0f14;
    border: 1px solid #253142;
    border-radius: 13px;
    text-decoration: none;
    color: white;
    transition: .2s ease;
}

.steam-account:hover {
    background: #18212d;
    border-color: #5865f2;
    transform: translateY(-2px);
}

.steam-account-icon {
    width: 42px;
    height: 42px;
    background: #18212d;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 800;
    color: #60a5fa;
    flex-shrink: 0;
}

.steam-account.alt .steam-account-icon {
    color: #a78bfa;
}

.steam-account-info {
    flex: 1;
}

.steam-account-name {
    font-size: 15px;
    font-weight: 700;
}

.steam-account-arrow {
    color: #93a2b7;
    font-size: 19px;
}

/* Leetify Stats */

.stats-section {
    margin-top: 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
}

.stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.stats-header h2 {
    font-size: 17px;
    font-weight: 700;
}

.leetify-heading {
    color: white;
    text-decoration: none;
    transition: color .2s ease;
}

.leetify-heading:hover {
    color: #f84982;
}

/* Refresh Controls */

.stats-controls {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
}

.refresh-btn {
    background: #1b2430;
    color: white;
    border: 1px solid #334155;
    padding: 9px 13px;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    transition: .2s;
}

.refresh-btn:hover {
    background: #263548;
    border-color: #5865f2;
}

.refresh-btn:disabled {
    opacity: .5;
    cursor: wait;
}

.stats-status {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
}

.stats-status:empty {
    display: none;
}

/* Stat Cards */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.stat-card {
    background: #0b0f14;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    min-width: 0;
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 9px;
}

.stat-value {
    font-size: 26px;
    font-weight: 800;
    overflow-wrap: anywhere;
}

.stat-value.pink {
    color: #f84982;
}

.stat-value.blue {
    color: #60a5fa;
}

.stat-value.purple {
    color: #a78bfa;
}

.stat-value.green {
    color: #34d399;
}

/* Leetify Logo Card */

.leetify-logo-card {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: .2s ease;
}

.leetify-logo-card img {
    display: block;
    width: 100%;
    max-width: 170px;
    height: auto;
    object-fit: contain;
}

.leetify-logo-card:hover {
    background: #121821;
    border-color: #f84982;
    transform: translateY(-2px);
}

/* API Error Message */

.stats-error {
    margin-top: 14px;
    font-size: 12px;
    line-height: 1.6;
    color: #f87171;
}

.stats-error:empty {
    display: none;
}

/* Discord Notification */

.toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: #1b2430;
    border: 1px solid #334155;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 2000;
}

.toast.show {
    opacity: 1;
}

/* CFG Download Button */

.settings-btn {
    position: fixed;
    right: 24px;
    bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 22px;
    background: #121821;
    border: 1px solid #253142;
    border-radius: 16px;
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: .2s ease;
    z-index: 1000;
    box-shadow: 0 0 20px rgba(88,101,242,.12);
}

.settings-btn:hover {
    transform: translateY(-3px);
    background: #18212d;
    border-color: #5865f2;
}

.settings-btn img {
    width: 24px;
    height: 24px;
    object-fit: contain;
}

/* Mobile */

@media (max-width: 600px) {
    .avatar {
        width: 130px;
        height: 130px;
    }

    h1 {
        font-size: 1.8rem;
    }

    .stats-section {
        padding: 16px;
    }

    .stat-card {
        padding: 12px;
    }

    .stat-value {
        font-size: 22px;
    }

    .leetify-logo-card img {
        max-width: 135px;
    }

    .settings-btn {
        right: 15px;
        bottom: 20px;
        padding: 12px 16px;
        font-size: 12px;
        gap: 8px;
    }

    .settings-btn img {
        width: 20px;
        height: 20px;
    }

    .steam-modal {
        padding: 20px;
    }

    .refresh-btn {
        font-size: 11px;
        padding: 8px 10px;
    }

    .stats-status {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Profile -->

    <div class="profile">
        <img src="dust.gif" alt="kwersi" class="avatar">
        <h1>kwersi</h1>
        <div class="username">@kwersi</div>
    </div>

    <!-- Social Links -->

    <div class="links">

        <a
            class="link"
            href="https://x.com/kwersi"

            <div class="link-title">twitter</div>
        </a>

        <button

            type="button"

        </button>

        <a

            target="_blank"

            <img src="icons/faceit.svg" alt="Faceit" class="icon">

        </a>

        <button
            class="link"
            type="button"

    <!-- Leetify Stats -->

    <section class="stats-section">

        <div class="stats-header">

                <a

                    href="https://leetify.com/app/profile/76561198354031646"

                <div class="stat-label">Positioning</div>

            <div class="stat-card">
                <div class="stat-label">Utility</div>

</div>

<!-- Steam Account Selection Popup -->

<div
    class="steam-overlay"
    id="steamOverlay"
    aria-hidden="true"
    onclick="closeSteamPopup(event)">

    <div
        class="steam-modal"
        role="dialog"

        <div class="steam-modal-header">

                &times;

        <div class="steam-accounts">

            <a
                class="steam-account"
                href="https://steamcommunity.com/profiles/76561198354031646"

</div>

<!-- CFG Download -->

<a
    href="settings/730.zip"
    download
    class="settings-btn"
    title="Download CS2 Settings">

    <img src="icons/cog.svg" alt="Settings">
    <span>Download CFG</span>

</a>

<!-- Discord Notification -->

<div id="toast" class="toast" role="status">
    Copied Discord username: @kwersi
</div>

<script>

/* Steam Popup */

let steamPreviousFocus = null;

function openSteamPopup() {
    const overlay = document.getElementById("steamOverlay");

    steamPreviousFocus = document.activeElement;
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

    overlay.querySelector(".steam-close").focus();
}

function closeSteamPopup(event) {
    const overlay = document.getElementById("steamOverlay");

    if (event && event.target !== overlay) {
        return;
    }

    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";

    if (steamPreviousFocus) {
        steamPreviousFocus.focus();
    }
}

document.addEventListener("keydown", function(event) {
    const overlay = document.getElementById("steamOverlay");

    if (!overlay.classList.contains("show")) return;

    if (event.key === "Escape") {
        closeSteamPopup();
        return;
    }

    if (event.key === "Tab") {
        const elements = Array.from(
            overlay.querySelectorAll("button, a[href]")
        );

        const first = elements[0];
        const last = elements[elements.length - 1];

        if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
        }
    }
});

/* Discord Copy */

let toastTimeout;

function copyDiscord() {
    navigator.clipboard.writeText("@kwersi")
        .then(() => {
            const toast = document.getElementById("toast");

            toast.classList.add("show");
            clearTimeout(toastTimeout);

            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        })
        .catch(() => {
            alert("Discord username: @kwersi");
        });
}

/* Leetify API */

const STEAM_ID = "76561198354031646";

const LEETIFY_API =
    "https://api-public.cs-prod.leetify.com/v3/profile" +
    "?steam64_id=" + STEAM_ID;

let statsLoading = false;
let lastUpdated = null;
let showUpdateTimer = false;

/* Update Timer */

function updateStatsTimer() {
    const status = document.getElementById("statsStatus");

    // Hide timer until Refresh Stats has been pressed
    if (!showUpdateTimer || lastUpdated === null) {
        status.textContent = "";
        return;
    }

    const elapsed = Math.max(
        0,
        Math.floor((Date.now() - lastUpdated) / 1000)
    );

    if (elapsed < 60) {
        status.textContent =
            "Updated " + elapsed +
            (elapsed === 1 ? " second ago" : " seconds ago");
    } else if (elapsed < 3600) {
        const minutes = Math.floor(elapsed / 60);

        status.textContent =
            "Updated " + minutes +
            (minutes === 1 ? " minute ago" : " minutes ago");
    } else if (elapsed < 86400) {
        const hours = Math.floor(elapsed / 3600);

        status.textContent =
            "Updated " + hours +
            (hours === 1 ? " hour ago" : " hours ago");
    } else {
        const days = Math.floor(elapsed / 86400);

        status.textContent =
            "Updated " + days +
            (days === 1 ? " day ago" : " days ago");
    }
}

/* Numeric Helpers */

function setStat(id, value) {
    document.getElementById(id).textContent =
        value === null || value === undefined || value === ""
            ? "—"
            : String(value);
}

function numberOrNull(value) {
    if (value === null || value === undefined || value === "") {
        return null;
    }

    const number = Number(value);
    return Number.isFinite(number) ? number : null;
}

function firstNumber(...values) {
    for (const value of values) {
        const number = numberOrNull(value);

        if (number !== null) return number;
    }

    return null;
}

function formatRating(value, decimals = 1) {
    const number = numberOrNull(value);

    return number === null
        ? "—"
        : number.toFixed(decimals);
}

function formatInteger(value) {
    const number = numberOrNull(value);

    return number === null
        ? "—"
        : Math.round(number).toLocaleString("en-US");
}

/* Fetch Leetify Statistics */

async function loadLeetifyStats(manualRefresh = false) {
    if (statsLoading) return;

    statsLoading = true;

    const status = document.getElementById("statsStatus");
    const errorMessage = document.getElementById("statsError");
    const button = document.getElementById("refreshStats");

    button.disabled = true;
    errorMessage.textContent = "";

    // Only display status when manually refreshing
    if (manualRefresh) {
        status.textContent = "Refreshing...";
    }

    try {
        const response = await fetch(LEETIFY_API, {
            method: "GET",
            headers: {
                "Accept": "application/json"
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "Leetify returned HTTP " + response.status
            );
        }

        const data = await response.json();

        if (!data || typeof data !== "object") {
            throw new Error("Invalid API response");
        }

        const rating = data.rating || {};
        const ranks = data.ranks || {};

        const overall = firstNumber(
            ranks.leetify,
            rating.leetify,
            rating.leetify_rating,
            rating.overall
        );

        const aim = firstNumber(
            rating.aim,
            rating.aim_rating
        );

        const positioning = firstNumber(
            rating.positioning,
            rating.positioning_rating
        );

        const utility = firstNumber(
            rating.utility,
            rating.utility_rating
        );

        const premier = firstNumber(
            ranks.premier,
            ranks.premier_rating
        );

        const winrate = numberOrNull(data.winrate);

        setStat(
            "leetifyRating",
            overall === null
                ? null
                : (overall > 0 ? "+" : "") +
                  formatRating(overall, 2)
        );

        setStat("premierRating", formatInteger(premier));
        setStat("aimRating", formatRating(aim));
        setStat("positioningRating", formatRating(positioning));
        setStat("utilityRating", formatRating(utility));

        setStat(
            "winRate",
            winrate === null
                ? null
                : (winrate * 100).toFixed(1) + "%"
        );

        setStat(
            "totalMatches",
            formatInteger(data.total_matches)
        );

        const available = [
            overall,
            premier,
            aim,
            positioning,
            utility,
            winrate,
            data.total_matches
        ].some(value => numberOrNull(value) !== null);

        if (!available) {
            throw new Error("No supported statistics found");
        }

        // Only start timer after a successful manual refresh
        if (manualRefresh) {
            lastUpdated = Date.now();
            showUpdateTimer = true;
            updateStatsTimer();
        }

    } catch (error) {
        console.error("Leetify API error:", error);

        errorMessage.textContent =
            "Unable to refresh Leetify statistics. Please try again later.";

        if (manualRefresh && lastUpdated === null) {
            status.textContent = "";
        } else {
            updateStatsTimer();
        }

    } finally {
        statsLoading = false;
        button.disabled = false;
    }
}

/* Update timer every second */

setInterval(() => {
    if (!statsLoading) {
        updateStatsTimer();
    }
}, 1000);

/* Load stats automatically without showing timer */

loadLeetifyStats(false);

</script>

</body>
</html>
