<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kwer.si</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0b0f14;
    --card:#121821;
    --card-hover:#18212d;
    --border:#253142;
    --text:#ffffff;
    --muted:#93a2b7;
    --accent:#5865f2;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.container{
    width:100%;
    max-width:560px;
}

.profile{
    text-align:center;
    margin-bottom:40px;
}

.avatar{
    width:160px;
    height:160px;
    margin:0 auto;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #5865f2,
        #7c3aed
    );
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:64px;
    font-weight:800;
    color:white;
    border:3px solid var(--border);

    box-shadow:
        0 0 40px rgba(88,101,242,.20),
        0 0 100px rgba(124,58,237,.10);
}

h1{
    margin-top:24px;
    font-size:2.2rem;
    font-weight:800;
}

.username{
    margin-top:10px;
    color:var(--muted);
    font-size:1rem;
}

.links{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.link{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px 22px;

    display:flex;
    align-items:center;
    gap:16px;

    color:white;
    text-decoration:none;

    transition:.2s ease;
}

.link:hover{
    transform:translateY(-3px);
    background:var(--card-hover);
    border-color:#3d5068;
}

.icon{
    width:28px;
    height:28px;
    object-fit:contain;
}

.link-title{
    font-weight:600;
    font-size:1rem;
}

.discord-card{
    cursor:pointer;
}

.toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:#1b2430;
    border:1px solid #334155;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

.toast.show{
    opacity:1;
}

@media (max-width:600px){

    .avatar{
        width:130px;
        height:130px;
        font-size:52px;
    }

    h1{
        font-size:1.9rem;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="profile">

        <div class="avatar">K</div>

        <h1>kwersi</h1>

        <div class="username">
            @kwersi
        </div>

    </div>

    <div class="links">

        <a
            class="link"
            href="https://x.com/kwersi"
            target="_blank">

            <img
                src="icons/x.svg"
                alt="X"
                class="icon">

            <div class="link-title">
                X / Twitter
            </div>

        </a>

        <a
            class="link"
            href="https://steamcommunity.com/profiles/76561198354031646"
            target="_blank">

            <img
                src="icons/steam.svg"
                alt="Steam"
                class="icon">

            <div class="link-title">
                Steam
            </div>

        </a>

        <div
            class="link discord-card"
            onclick="copyDiscord()">

            <img
                src="icons/discord.svg"
                alt="Discord"
                class="icon">

            <div class="link-title">
                Discord • @kwersi
            </div>

        </div>

    </div>

</div>

<div id="toast" class="toast">
    Copied Discord username: kwersi
</div>

<script>
function copyDiscord() {
    navigator.clipboard.writeText("kwersi");

    const toast = document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2000);
}
</script>

</body>
</html>
