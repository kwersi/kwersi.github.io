
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SE01 EL &amp; LYFT work</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    background: #111217;
    color: #d8d9da;
    font: 14px Arial, sans-serif;
}

section {
    background: #181b1f;
    border: 1px solid #30343b;
    border-radius: 4px;
    padding: 16px;
}

h1 {
    font-size: 18px;
    margin: 0 0 16px;
}

header {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
}

button, input {
    font: inherit;
    color: inherit;
    background: #22252b;
    border: 1px solid #444b55;
    border-radius: 4px;
    padding: 8px;
}

button {
    cursor: pointer;
}

button:hover {
    background: #343943;
}

button:disabled {
    opacity: 0.4;
    cursor: default;
}

.scroll {
    overflow: auto;
}

table {
    border-collapse: collapse;
    width: 100%;
    white-space: nowrap;
}

th, td {
    text-align: left;
    padding: 9px;
    border-bottom: 1px solid #30343b;
}

th {
    background: #22252b;
    cursor: pointer;
}

tr:hover td {
    background-color: #292d35;
}

td.pr {
    text-align: center;
}

#message {
    color: #a7adb7;
}

footer {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
}

.filter {
    width: 100%;
    min-width: 45px;
    padding: 4px;
    font-size: 12px;
}

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    section {
        padding: 10px;
    }
}
</style>
</head>

<body>

<section>

    <h1>SE01 EL &amp; LYFT work</h1>

    <header>

        <label>
            Importera arbetsordrar:
            <input
                type="file"
                id="file"
                accept=".json,.txt,application/json">
        </label>

        <input
            id="search"
            placeholder="Sök i tabellen">

        <button id="demo">
            Visa exempeldata
        </button>

    </header>

    <p id="message" role="status">
        Ingen data inläst. Importera ett API-svar
        i JSON-format eller visa exempeldata.
    </p>

    <div class="scroll">

        <table>
            <thead id="head"></thead>
            <tbody id="rows"></tbody>
        </table>

    </div>

    <footer>

        <button id="prev">
            Föregående
        </button>

        <span id="page"></span>

        <button id="next">
            Nästa
        </button>

    </footer>

</section>

<script>

const $ = id => document.getElementById(id);

/* Table columns */

const columns = [
    ["wonum", "Work Order"],
    ["location", "Location"],
    ["assetnum", "Asset"],
    ["wopriority", "PR"],
    ["persongroup", "Person Group"],
    ["reportdate", "Report Date"],
    ["description2", "Description"]
];

/* Table settings */

let data = [];
let sortKey = "wopriority";
let descending = true;
let page = 0;

const filters = {};
const pageSize = 50;

/* Date formatting */

function dateText(value) {

    if (!value) return "-";

    const date = new Date(value);

    if (!Number.isFinite(date.getTime())) {
        return "-";
    }

    const pad = number =>
        String(number).padStart(2, "0");

    const weekday = date.toLocaleDateString(
        "en-GB",
        { weekday: "short" }
    );

    return weekday + ", " +
        pad(date.getDate()) + "-" +
        pad(date.getMonth() + 1) + " " +
        pad(date.getHours()) + ":" +
        pad(date.getMinutes());
}

/* Transform work orders */

function normalize(workOrder) {

    const description =
        workOrder.description2 ??
        (
            (workOrder.description ?? "") +
            " [" +
            (
                workOrder.assetnum != null
                    ? workOrder.asset_description ?? ""
                    : workOrder.location_description ?? ""
            ) +
            "]"
        );

    return {
        wonum: workOrder.wonum ?? "",
        location: workOrder.location ?? "",
        assetnum: workOrder.assetnum ?? "",
        wopriority: workOrder.wopriority ?? "",
        persongroup: workOrder.persongroup ?? "",
        reportdate: dateText(workOrder.reportdate),
        description2: description
    };
}

/* Create table headings and filters */

const headings = document.createElement("tr");
const filterRow = document.createElement("tr");

for (const [key, label] of columns) {

    const th = document.createElement("th");

    th.textContent = label;
    th.tabIndex = 0;

    const sort = () => {

        descending =
            sortKey === key
                ? !descending
                : false;

        sortKey = key;
        page = 0;

        render();
    };

    th.onclick = sort;

    th.onkeydown = event => {
        if (event.key === "Enter") {
            sort();
        }
    };

    headings.append(th);

    const filterCell =
        document.createElement("th");

    const input =
        document.createElement("input");

    input.className = "filter";
    input.placeholder = "Filter";

    input.setAttribute(
        "aria-label",
        "Filter " + label
    );

    input.oninput = () => {

        filters[key] =
            input.value.toLowerCase();

        page = 0;

        render();
    };

    filterCell.append(input);
    filterRow.append(filterCell);
}

$("head").append(headings, filterRow);

/* Render table */

function render() {

    const search =
        $("search").value.toLowerCase();

    const list = data

        .filter(row => {

            const matchesSearch = columns.some(
                ([key]) =>
                    String(row[key] ?? "")
                        .toLowerCase()
                        .includes(search)
            );

            const matchesFilters =
                Object.entries(filters).every(
                    ([key, value]) =>
                        String(row[key] ?? "")
                            .toLowerCase()
                            .includes(value)
                );

            return matchesSearch &&
                   matchesFilters;
        })

        .sort((a, b) => {

            const x = a[sortKey] ?? "";
            const y = b[sortKey] ?? "";

            return String(x).localeCompare(
                String(y),
                undefined,
                { numeric: true }
            ) * (descending ? -1 : 1);
        });

    const pages = Math.max(
        1,
        Math.ceil(list.length / pageSize)
    );

    page = Math.max(
        0,
        Math.min(page, pages - 1)
    );

    $("rows").replaceChildren();

    const visibleRows = list.slice(
        page * pageSize,
        (page + 1) * pageSize
    );

    for (const row of visibleRows) {

        const tr =
            document.createElement("tr");

        for (const [key] of columns) {

            const td =
                document.createElement("td");

            td.textContent =
                String(row[key] ?? "");

            /* Priority colors */

            if (key === "wopriority") {

                td.className = "pr";

                const priority =
                    Number(row[key]);

                if (priority >= 9) {

                    td.style.backgroundColor =
                        "#8b3038";

                } else if (priority >= 8) {

                    td.style.backgroundColor =
                        "#80651e";

                } else if (priority >= 7) {

                    td.style.backgroundColor =
                        "#28643e";
                }
            }

            tr.append(td);
        }

        $("rows").append(tr);
    }

    $("page").textContent =
        `Sida ${page + 1} av ${pages} · ${list.length} rader`;

    $("prev").disabled = page === 0;
    $("next").disabled = page >= pages - 1;
}

/* Load work order data */

function load(raw, label) {

    const list = Array.isArray(raw)
        ? raw
        : raw?.member;

    if (
        !Array.isArray(list) ||
        list.some(
            item =>
                !item ||
                typeof item !== "object" ||
                Array.isArray(item)
        )
    ) {
        throw new Error(
            "JSON måste innehålla en lista med arbetsordrar eller member."
        );
    }

    data = list.map(normalize);

    page = 0;

    $("message").textContent = label;

    render();
}

/* Import local JSON file */

$("file").onchange = async event => {

    try {

        const file = event.target.files[0];

        if (!file) return;

        const content = await file.text();
        const json = JSON.parse(content);

        load(
            json,
            "Importerad data från lokal fil."
        );

    } catch (error) {

        $("message").textContent =
            error.message;
    }
};

/* Demonstration data */

$("demo").onclick = () => {

    load([

        {
            wonum: "DEMO-001",
            location: "EXEMPEL",
            assetnum: "DEMO",
            wopriority: 9,
            description: "Exempel på arbetsorder",
            asset_description: "Exempelutrustning"
        },

        {
            wonum: "DEMO-002",
            location: "EXEMPEL",
            wopriority: 8,
            description: "Exempel på planerat arbete"
        },

        {
            wonum: "DEMO-003",
            location: "EXEMPEL",
            wopriority: 7,
            description: "Exempel på förebyggande arbete"
        }

    ], "EXEMPELDATA – inte verkliga arbetsordrar.");
};

/* Search */

$("search").oninput = () => {
    page = 0;
    render();
};

/* Pagination */

$("prev").onclick = () => {
    page--;
    render();
};

$("next").onclick = () => {
    page++;
    render();
};

/* Initial render */

render();

</script>

</body>
</html>
